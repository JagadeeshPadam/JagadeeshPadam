<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <!-- Signal beam glow from top-center -->
    <radialGradient id="signalGlow" cx="50%" cy="0%" r="85%" fx="50%" fy="0%">
      <stop offset="0%"   stop-color="#F5C518" stop-opacity="0.32"/>
      <stop offset="45%"  stop-color="#F5C518" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F5C518" stop-opacity="0"/>
    </radialGradient>
    <!-- Text glow -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Bat glow -->
    <filter id="batGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Scan line pattern -->
    <pattern id="scanlines" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#F5C518" opacity="0.015"/>
    </pattern>
  </defs>

  <!-- ── Base background ── -->
  <rect width="900" height="220" fill="#080808"/>

  <!-- ── Scanline overlay ── -->
  <rect width="900" height="220" fill="url(#scanlines)"/>

  <!-- ── Bat-Signal beam from top center ── -->
  <ellipse cx="450" cy="-10" rx="520" ry="340" fill="url(#signalGlow)"/>

  <!-- ── Gotham skyline left ── -->
  <rect x="0"   y="178" width="22"  height="42" fill="#111"/>
  <rect x="18"  y="160" width="16"  height="60" fill="#111"/>
  <rect x="26"  y="170" width="12"  height="50" fill="#111"/>
  <rect x="36"  y="148" width="20"  height="72" fill="#111"/>
  <rect x="54"  y="162" width="26"  height="58" fill="#111"/>
  <rect x="78"  y="150" width="18"  height="70" fill="#111"/>
  <rect x="93"  y="168" width="22"  height="52" fill="#111"/>
  <rect x="112" y="142" width="28"  height="78" fill="#111"/>
  <!-- window dots left -->
  <rect x="40"  y="155" width="3" height="3" fill="#F5C518" opacity="0.2"/>
  <rect x="40"  y="163" width="3" height="3" fill="#F5C518" opacity="0.15"/>
  <rect x="48"  y="155" width="3" height="3" fill="#F5C518" opacity="0.2"/>
  <rect x="116" y="148" width="3" height="3" fill="#F5C518" opacity="0.2"/>
  <rect x="124" y="148" width="3" height="3" fill="#F5C518" opacity="0.15"/>
  <rect x="116" y="156" width="3" height="3" fill="#F5C518" opacity="0.18"/>

  <!-- left fill to center -->
  <rect x="135" y="172" width="20"  height="48" fill="#111"/>
  <rect x="152" y="158" width="24"  height="62" fill="#111"/>
  <rect x="173" y="168" width="18"  height="52" fill="#111"/>
  <rect x="188" y="152" width="22"  height="68" fill="#111"/>
  <rect x="207" y="174" width="16"  height="46" fill="#111"/>
  <rect x="222" y="160" width="20"  height="60" fill="#111"/>

  <!-- ── Gotham skyline right (mirrored) ── -->
  <rect x="898" y="178" width="22"  height="42" fill="#111" transform="scale(-1,1) translate(-900,0)"/>
  <rect x="882" y="160" width="16"  height="60" fill="#111" transform="scale(-1,1) translate(-900,0)"/>
  <rect x="874" y="170" width="12"  height="50" fill="#111" transform="scale(-1,1) translate(-900,0)"/>
  <rect x="864" y="148" width="20"  height="72" fill="#111" transform="scale(-1,1) translate(-900,0)"/>
  <rect x="846" y="162" width="26"  height="58" fill="#111" transform="scale(-1,1) translate(-900,0)"/>
  <rect x="822" y="150" width="18"  height="70" fill="#111" transform="scale(-1,1) translate(-900,0)"/>
  <rect x="807" y="168" width="22"  height="52" fill="#111" transform="scale(-1,1) translate(-900,0)"/>
  <rect x="788" y="142" width="28"  height="78" fill="#111" transform="scale(-1,1) translate(-900,0)"/>
  <!-- window dots right -->
  <rect x="852" y="155" width="3" height="3" fill="#F5C518" opacity="0.2"/>
  <rect x="852" y="163" width="3" height="3" fill="#F5C518" opacity="0.15"/>
  <rect x="844" y="155" width="3" height="3" fill="#F5C518" opacity="0.2"/>
  <rect x="776" y="148" width="3" height="3" fill="#F5C518" opacity="0.2"/>
  <rect x="768" y="148" width="3" height="3" fill="#F5C518" opacity="0.15"/>
  <rect x="776" y="156" width="3" height="3" fill="#F5C518" opacity="0.18"/>
  <!-- right fill to center -->
  <rect x="678" y="172" width="20"  height="48" fill="#111" transform="scale(-1,1) translate(-900,0)"/>
  <rect x="661" y="158" width="24"  height="62" fill="#111" transform="scale(-1,1) translate(-900,0)"/>
  <rect x="640" y="168" width="18"  height="52" fill="#111" transform="scale(-1,1) translate(-900,0)"/>
  <rect x="625" y="152" width="22"  height="68" fill="#111" transform="scale(-1,1) translate(-900,0)"/>
  <rect x="606" y="174" width="16"  height="46" fill="#111" transform="scale(-1,1) translate(-900,0)"/>
  <rect x="591" y="160" width="20"  height="60" fill="#111" transform="scale(-1,1) translate(-900,0)"/>

  <!-- ── Name ── -->
  <text
    x="450" y="110"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="46"
    font-weight="700"
    fill="#F5C518"
    text-anchor="middle"
    letter-spacing="8"
    filter="url(#glow)">JAGADEESH PADAM</text>

  <!-- ── Divider ── -->
  <line x1="160" y1="127" x2="740" y2="127" stroke="#F5C518" stroke-width="0.8" opacity="0.45"/>

  <!-- ── Subtitle ── -->
  <text
    x="450" y="152"
    font-family="'Courier New', Courier, monospace"
    font-size="12"
    fill="#F5C518"
    text-anchor="middle"
    letter-spacing="5"
    opacity="0.72">DARK KNIGHT OF CODE  ·  AI &amp; BACKEND ENGINEER  ·  GOTHAM'S DATA GUARDIAN</text>

  <!-- ── Bottom accent bar ── -->
  <rect x="0" y="216" width="900" height="4" fill="#F5C518" opacity="0.85"/>

  <!-- ── Side tick marks ── -->
  <rect x="0"   y="0" width="4" height="220" fill="#F5C518" opacity="0.15"/>
  <rect x="896" y="0" width="4" height="220" fill="#F5C518" opacity="0.15"/>
</svg>
